name: leapmentor

networks:
  leapmentor:
    external: true

volumes:
  streams-redis-data:

x-common-env: &common-env
  NODE_ENV: production
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Local gateway on :8080
  APP_BASE_URL: http://localhost:8080
  FRONTEND_URL: http://localhost:8080
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  SOCKET_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
  GOOGLE_REDIRECT_URI: http://localhost:8080/api/v1/google-calendar/callback

x-streams-env: &streams-env
  STREAMS_REDIS_HOST: leap-streams-redis
  STREAMS_REDIS_PORT: "6379"
  STREAMS_REDIS_PASSWORD: ${STREAMS_REDIS_PASSWORD:?set STREAMS_REDIS_PASSWORD in the root .env}
  STREAMS_REDIS_TLS: "false"
  STREAMS_REDIS_DB: "0"

services:
  leap-streams-redis:
    image: redis:6.2
    container_name: leap-streams-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${STREAMS_REDIS_PASSWORD:?set STREAMS_REDIS_PASSWORD in the root .env}
    environment:
      REDIS_PASSWORD: ${STREAMS_REDIS_PASSWORD:?set STREAMS_REDIS_PASSWORD in the root .env}
    volumes:
      - streams-redis-data:/data
    networks:
      - leapmentor
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: leapmentor/frontend:dev
    container_name: frontend
    build:
      context: ../Leapmentor-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in the root .env}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:?set VITE_GOOGLE_CLIENT_ID in the root .env}
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY:-}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_BETTERSTACK_SOURCE_TOKEN: ${VITE_BETTERSTACK_SOURCE_TOKEN:-}
        VITE_APP_VERSION: local
    ports:
      - "8080:8080"
    volumes:
      - ../Leapmentor-frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - leapmentor
    depends_on:
      - identity
      - catalog
      - engagement
      - payments
      - communication

  identity:
    image: leapmentor/identity:dev
    container_name: identity
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    env_file: services/identity-service/.env
    environment:
      <<: [*common-env, *streams-env]
      CATALOG_SERVICE_URL: http://catalog:5002
      ENGAGEMENT_SERVICE_URL: http://engagement:5003
      PAYMENTS_SERVICE_URL: http://payments:5004
    ports:
      - "5101:5001"
    networks:
      - leapmentor
    depends_on:
      leap-streams-redis:
        condition: service_healthy

  catalog:
    image: leapmentor/catalog:dev
    container_name: catalog
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    env_file: services/catalog-service/.env
    environment:
      <<: [*common-env, *streams-env]
    ports:
      - "5102:5002"
    networks:
      - leapmentor
    depends_on:
      leap-streams-redis:
        condition: service_healthy

  engagement:
    image: leapmentor/engagement:dev
    container_name: engagement
    build:
      context: .
      dockerfile: services/engagement-service/Dockerfile
    env_file: services/engagement-service/.env
    environment:
      <<: [*common-env, *streams-env]
      COMMUNICATION_SERVICE_URL: http://communication:5005
      PAYMENTS_SERVICE_URL: http://payments:5004
      CATALOG_SERVICE_URL: http://catalog:5002
    ports:
      - "5103:5003"
    networks:
      - leapmentor
    depends_on:
      leap-streams-redis:
        condition: service_healthy

  payments:
    image: leapmentor/payments:dev
    container_name: payments
    build:
      context: .
      dockerfile: services/payments-service/Dockerfile
    env_file: services/payments-service/.env
    environment:
      <<: [*common-env, *streams-env]
    ports:
      - "5104:5004"
    networks:
      - leapmentor
    depends_on:
      leap-streams-redis:
        condition: service_healthy

  communication:
    image: leapmentor/communication:dev
    container_name: communication
    build:
      context: .
      dockerfile: services/communication-service/Dockerfile
    env_file: services/communication-service/.env
    environment:
      <<: [*common-env, *streams-env]
    ports:
      - "5105:5005"
    networks:
      - leapmentor
    depends_on:
      leap-streams-redis:
        condition: service_healthy
